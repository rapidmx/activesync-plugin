name: Publish

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  # A release pushes main and its tag at the same commit, and each push runs Build. Publish only from the tag's own Build,
  # and only once every Build of that commit has finished green: a failed run on either ref (even one that passes when
  # rerun) blocks the release until it is rerun green, which triggers this workflow again.
  check:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Require a release tag on main and every Build of its commit green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
        run: |
          set -euo pipefail
          if ! git tag --points-at HEAD | grep -qxF "$TAG" || ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $TAG doesn't point at $SHA on main; not publishing."
            exit 1
          fi
          url="repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?head_sha=$SHA&per_page=100"
          for attempt in $(seq 1 90); do
            pending=$(gh api "$url" --jq '[.workflow_runs[] | select(.status != "completed")] | length')
            failed=$(gh api "$url" --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion != "success")
              | "\(.id) (\(.head_branch)): \(.conclusion)"] | join(", ")')
            if [ -n "$failed" ]; then
              echo "::error::Not publishing $TAG: a Build of $SHA did not succeed: $failed. Rerun it; a green rerun triggers this workflow again."
              exit 1
            fi
            if [ "$pending" = 0 ]; then
              echo "Every Build of $SHA succeeded: $(gh api "$url" --jq '[.workflow_runs[] | "\(.id) (\(.head_branch))"] | join(", ")')"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for the other Builds of $SHA to finish."
          exit 1

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds

      - name: Enable corepack
        run: corepack enable

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            dist
            docs
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Publish to npm
        # A prerelease version (1.0.0-beta.N) must be published under an explicit dist-tag: npm refuses it otherwise, and it must not become `latest`.
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi
          npm publish --access public --tag "$tag"
